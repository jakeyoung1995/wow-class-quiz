name: Weekly Tier List Update

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — parse and report only; no commit, no email, no issues'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  update-tier-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # sitemap <lastmod> is derived from per-file git dates
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run tier update script
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SUBSCRIBER_FETCH_URL: ${{ secrets.SUBSCRIBER_FETCH_URL }}
          SUBSCRIBER_FETCH_KEY: ${{ secrets.SUBSCRIBER_FETCH_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/update_tier_data.py

      # The scraper writes the JSON, but titles, Schema.org blocks and the
      # premium quizzes' tier letters are stamped from it. Committing the JSON
      # alone leaves those stale — and since that drift is now a check_site
      # error, the next PR would fail with an error nobody caused.
      - name: Restamp copy derived from the tier data
        if: ${{ !inputs.dry_run }}
        run: |
          python3 scripts/stamp_patch_copy.py
          python3 scripts/update_sitemap.py
          python3 scripts/check_site.py

      - name: Commit updated tier data
        if: ${{ !inputs.dry_run }}
        run: |
          git config --global user.name "wow-class-quiz-bot"
          git config --global user.email "actions@github.com"
          git add wow-patch-data.json *.html
          if git diff --cached --quiet; then
            echo "No changes to tier data or stamped copy -- nothing to commit."
          else
            git commit -m "chore: weekly tier update $(date +%Y-%m-%d) [skip ci]"
            git push
            echo "Committed and pushed tier data update."
          fi
