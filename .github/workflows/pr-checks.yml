name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    name: Validate site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Per-file git dates drive sitemap <lastmod>. A shallow clone has no
          # history, so the check would pass by skipping rather than by being
          # correct.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # scripts/check_site.py is stdlib-only on purpose, so there is nothing
      # to install and this stays fast. Run the same command locally before
      # opening a PR: python3 scripts/check_site.py
      - name: Run site checks
        run: python3 scripts/check_site.py

      # The weekly scraper rewrites this file unattended. A malformed commit
      # would break tier-list.html in the browser with no other signal.
      # wow-patch-data.json is the source of truth for patch/season/S-tier.
      # This fails if the HTML copy has drifted from it — the failure mode that
      # left the site advertising Season 1 for months after Season 2 shipped.
      - name: Check patch/season copy is stamped
        run: python3 scripts/stamp_patch_copy.py --check

      # A wrong lastmod is worse than none: it tells crawlers a changed page is
      # unchanged. After the price change, 15 of 16 entries claimed that.
      - name: Check sitemap lastmod dates
        run: python3 scripts/update_sitemap.py --check

      - name: Validate tier data JSON
        run: python3 -c "import json; json.load(open('wow-patch-data.json')); print('wow-patch-data.json is valid JSON')"
