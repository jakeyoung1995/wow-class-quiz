name: Patch Watch

# Latency is the whole point: when Blizzard flips a patch live, the site should
# say so within minutes, not on the next weekly tier run. Public repos get
# unlimited Actions minutes, so a 15-minute poll costs nothing.
#
# GitHub's scheduler can run late under load, so realistically this lands
# within ~20 minutes of a patch going live rather than exactly 15.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: patch-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Exit code carries the decision: 0 nothing, 10 patch live, 11 PTR ahead.
      - name: Check Blizzard version endpoint
        id: watch
        continue-on-error: true
        # Steps run under `bash -e`, so a non-zero exit would abort before the
        # echo and the decision would be lost. `|| code=$?` keeps it alive.
        run: |
          code=0
          python3 scripts/patch_watch.py || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "patch_watch exited $code"

      # ---- A patch went live -------------------------------------------
      # Mechanical facts only: patch number, season label, build, and the
      # stamped copy that derives from them. Anything needing judgement is
      # left to the prep PR.
      - name: Stamp the new patch and deploy
        if: steps.watch.outputs.code == '10'
        run: |
          python3 scripts/update_tier_data.py || true
          python3 scripts/stamp_patch_copy.py
          python3 scripts/check_site.py

          git config --global user.name "wow-class-quiz-bot"
          git config --global user.email "actions@github.com"
          git add wow-patch-data.json *.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: patch ${{ steps.watch.outputs.to }} is live [skip ci]"
            git push
            echo "Patch update pushed — GitHub Pages will deploy it."
          fi
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Open a release checklist issue
        if: steps.watch.outputs.code == '10'
        uses: actions/github-script@v7
        with:
          script: |
            const to = '${{ steps.watch.outputs.to }}';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Patch ${to} is live — content review`,
              labels: ['patch-release'],
              body: [
                `Patch **${to}** went live and the mechanical fields have already been`,
                `stamped and deployed: \`_meta.patch\`, \`_meta.build\`, and every`,
                `title / meta / Schema.org string that derives from them.`,
                ``,
                `These need a human or a prep PR:`,
                ``,
                `- [ ] \`_meta.season\` — Blizzard publishes no machine-readable season`,
                `- [ ] New or reworked specs — run the \`patch-prep\` skill`,
                `- [ ] Premium quiz tier blocks (still hardcoded — TASKS.md Phase 5)`,
                `- [ ] Promote any \`patch_preview\` content from preview to live`,
                ``,
                `_Filed automatically by patch-watch.yml._`
              ].join('\n')
            });

      # ---- A new patch entered PTR --------------------------------------
      # This is the prep window opening. One issue per PTR patch, not one
      # every 15 minutes: the title is searched before filing.
      - name: Open a prep-window issue
        if: steps.watch.outputs.code == '11'
        uses: actions/github-script@v7
        with:
          script: |
            const ptr = '${{ steps.watch.outputs.ptr }}';
            const title = `Prep window open — patch ${ptr} is on PTR`;
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`
            });
            if (existing.data.total_count > 0) {
              core.info('Prep issue already exists — not filing another.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['patch-prep'],
              body: [
                `Blizzard's PTR is running **${ptr}** while live is still`,
                `**${{ steps.watch.outputs.live }}**. That is the lead time to prepare.`,
                ``,
                `Run the \`patch-prep\` skill to draft the changes, then merge the PR it`,
                `opens. Prepared content ships behind the premium gate first and goes`,
                `public automatically when patch-watch sees ${ptr} go live.`,
                ``,
                `_Filed automatically by patch-watch.yml._`
              ].join('\n')
            });
